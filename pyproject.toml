[project]
name = "docparse"
version = "0.1.0"
description = "Local document parsing (PyMuPDF, PaddleOCR) with visual inspection and semantic search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf",
    "pillow",
    "pandas",
    "pyarrow",
    "httpx>=0.28.1",
    "paddlepaddle-gpu==3.3.1",
    "paddleocr[doc-parser]>=3.7",
    "sentence-transformers[image]>=6.1",
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
