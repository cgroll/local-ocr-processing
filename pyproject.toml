[project]
name = "docparse"
version = "0.1.0"
description = "Local document parsing (PyMuPDF, PaddleOCR) with visual inspection and semantic search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf",
    "pillow",
    "pandas",
    "pyarrow",
    "httpx>=0.28.1",
]

# Model dependencies are added by the `define-models` change
# (paddlepaddle-gpu from the paddle-cu126 index, paddleocr[doc-parser]>=3.7, embedding stack).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
